name: Build & Release MacroEngine

on:
  push:
    branches:
      - main   # Build + release a chaque push sur main
  workflow_dispatch:   # Lancement manuel depuis l'onglet Actions

permissions:
  contents: write   # Nécessaire pour créer/modifier les releases GitHub

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'electron-app/package-lock.json'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache embedded Python + Tesseract
        uses: actions/cache@v4
        with:
          path: |
            electron-app/python-embed
            tesseract
          key: python-embed-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Cache Electron + electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-cache-${{ runner.os }}-${{ hashFiles('electron-app/package-lock.json') }}

      - name: Install Node dependencies
        working-directory: electron-app
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Get version from package.json
        id: pkg_version
        run: |
          $version = (Get-Content electron-app/package.json | ConvertFrom-Json).version
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG=v$version" >> $env:GITHUB_OUTPUT

      # ── Génération du manifest de mise à jour ────────────────────────────────
      - name: Generate update-manifest.json
        run: node electron-app/scripts/generate-manifest.js

      - name: Commit update-manifest.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update-manifest.json
          # Ne committer que si le fichier a changé
          if (git diff --cached --quiet) {
            Write-Host "update-manifest.json unchanged — skipping commit"
          } else {
            git commit -m "chore: update manifest v${{ steps.pkg_version.outputs.VERSION }} [skip ci]"
            git push
          }

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Check icons
        working-directory: electron-app
        run: npm run check-icons

      - name: Prepare Python
        working-directory: electron-app
        run: npm run prepare-python

      - name: Build Installer + Portable EXE
        working-directory: electron-app
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Verify build output
        working-directory: electron-app
        run: |
          $ok = $true
          $v = "${{ steps.pkg_version.outputs.VERSION }}"
          foreach ($name in @("MacroEngine-Setup-$v.exe", "MacroEngine-Portable-$v.exe")) {
            if (-not (Test-Path "dist/$name")) {
              Write-Host "$name not found!" -ForegroundColor Red
              $ok = $false
            } else {
              $size = [math]::Round((Get-Item "dist/$name").Length / 1MB, 1)
              Write-Host "$name OK - $size MB" -ForegroundColor Green
            }
          }
          if (-not $ok) { exit 1 }

      - name: Generate release notes from CHANGELOG
        id: changelog
        run: |
          $content = Get-Content CHANGELOG.md -Raw
          if ($content -match '(?s)## \[[\d.]+\][^\n]*\n\n(.*?)(?=\n## \[|\Z)') {
            $notes = $matches[1].Trim()
          } else {
            $notes = "Voir CHANGELOG.md pour les details."
          }
          echo "NOTES<<EOF" >> $env:GITHUB_OUTPUT
          echo $notes >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT

      - name: Create / Update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.pkg_version.outputs.TAG }}
          name: "MacroEngine v${{ steps.pkg_version.outputs.VERSION }}"
          body: ${{ steps.changelog.outputs.NOTES }}
          artifacts: "electron-app/dist/MacroEngine-Setup-${{ steps.pkg_version.outputs.VERSION }}.exe,electron-app/dist/MacroEngine-Portable-${{ steps.pkg_version.outputs.VERSION }}.exe"
          artifactContentType: "application/octet-stream"
          allowUpdates: true
          removeArtifacts: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
