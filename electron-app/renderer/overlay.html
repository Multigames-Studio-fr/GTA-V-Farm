<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' file: data:; img-src 'self' data:;">
  <title>MacroEngine Overlay</title>
  <style>
    /* DA « Los Santos Nuit » — version légère. Page autonome : ne dépend pas de styles.css/da.css. */
    @font-face { font-family: 'Barlow'; font-weight: 400; font-display: swap; src: url('fonts/barlow-400.woff2') format('woff2'); }
    @font-face { font-family: 'Barlow'; font-weight: 500; font-display: swap; src: url('fonts/barlow-500.woff2') format('woff2'); }
    @font-face { font-family: 'Barlow'; font-weight: 600; font-display: swap; src: url('fonts/barlow-600.woff2') format('woff2'); }
    @font-face { font-family: 'Barlow Condensed'; font-weight: 600; font-display: swap; src: url('fonts/barlow-condensed-600.woff2') format('woff2'); }
    @font-face { font-family: 'Barlow Condensed'; font-weight: 700; font-display: swap; src: url('fonts/barlow-condensed-700.woff2') format('woff2'); }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --op:      .55;                 /* overlayOpacity / 100 */
      --accent:  #e5372b;
      --accent-2:#ff6b5e;
      --ok:      #4ade80;
      --warn:    #fbbf24;
      --err:     #ef4444;
      --text:    #f4f4f6;
      --text-b:  #ededf0;
      --text-2:  #a8a8b4;
      --text-3:  #8b8b98;
      --idle:    #6b6b76;
      --idle-t:  #b4b4be;
      --f:       'Barlow', 'Segoe UI', system-ui, sans-serif;
      --fc:      'Barlow Condensed', 'Barlow', 'Segoe UI', sans-serif;
    }

    html, body {
      background: transparent; overflow: hidden; user-select: none;
      font-family: var(--f); color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    body { padding: 8px; }

    /* Everything visible lives in #wrap; its size drives the window size. */
    #wrap { display: flex; flex-direction: column; gap: 6px; width: max-content; }

    button {
      font-family: var(--f); cursor: pointer; border: 0;
      -webkit-app-region: no-drag;
    }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 1px; }

    /* ── Card (expanded) ── */
    #card {
      width: 250px;
      background: rgba(10,10,13,var(--op));
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-radius: 12px; overflow: hidden;
      display: flex; flex-direction: column;
      box-shadow: 0 6px 24px rgba(0,0,0,.25);
    }

    #bar {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 6px 6px 4px;
      -webkit-app-region: drag; cursor: grab;
    }
    .grip { width: 18px; color: var(--text-3); font-size: 13px; text-align: center; letter-spacing: -2px; flex-shrink: 0; }
    .sdot { width: 6px; height: 6px; border-radius: 50%; background: var(--idle); flex-shrink: 0; transition: background .3s; }
    .sdot.on    { background: var(--ok); }
    .sdot.pause { background: var(--warn); }
    #bar-count { font-size: 12px; font-weight: 600; color: #e9e9ee; white-space: nowrap; }
    .bar-btns { margin-left: auto; display: flex; gap: 2px; }
    .ib {
      width: 24px; height: 24px; border-radius: 6px;
      background: transparent; color: var(--text-2); font-size: 13px; line-height: 24px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .ib:hover { background: rgba(255,255,255,.08); color: var(--text-b); }
    .ib[aria-expanded="true"] { background: rgba(255,255,255,.1); color: var(--text-b); }

    /* locked / click-through: no window drag from the bar */
    body.locked #bar, body.locked #pill,
    body.ct #bar, body.ct #pill { -webkit-app-region: no-drag; cursor: default; }
    body.locked .grip { opacity: .35; }

    /* ── Stats ── */
    #stats { display: flex; justify-content: space-between; padding: 2px 12px 10px; }
    .st { display: flex; flex-direction: column; }
    .st-v { font-family: var(--fc); font-weight: 600; font-size: 20px; line-height: 1.05; color: var(--text); font-variant-numeric: tabular-nums; }
    .st-v.ok  { color: var(--ok); }
    .st-v.err { color: var(--err); }
    .st-l { font-size: 10.5px; color: var(--text-2); }

    /* ── Meal ── */
    #meal { padding: 0 12px 10px; display: flex; flex-direction: column; gap: 5px; }
    .meal-row { display: flex; justify-content: space-between; font-size: 12px; gap: 8px; }
    .meal-row .lbl { color: var(--text-2); }
    .dim { color: var(--text-2); }
    .prog { height: 3px; border-radius: 2px; background: rgba(255,255,255,.12); }
    .prog > div { height: 3px; width: 0; border-radius: 2px; background: var(--accent); transition: width .6s linear; }

    /* ── Macros ── */
    #mlist { padding: 0 6px 6px; display: flex; flex-direction: column; max-height: 176px; overflow-y: auto; }
    .mr { display: flex; align-items: center; gap: 8px; padding: 5px 6px; }
    .mr .sdot { background: var(--idle); }
    .mr.r .sdot { background: var(--ok); }
    .mn {
      flex: 1; min-width: 0; font-size: 12.5px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--idle-t);
    }
    .mr.r .mn { color: var(--text); }
    .mm { font-size: 11px; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .mb {
      width: 24px; height: 24px; border-radius: 6px; flex-shrink: 0;
      background: rgba(255,255,255,.08); color: var(--text-b); font-size: 10px;
    }
    .mb:hover { background: rgba(255,255,255,.16); }
    .empty { padding: 6px 6px 8px; font-size: 12px; color: var(--text-3); }

    /* ── Auto Clicker (compact row) ── */
    #acp { display: flex; align-items: center; gap: 8px; padding: 0 12px 8px; }
    #acp .sdot.on { background: var(--warn); }
    #acp-title { font-size: 12px; font-weight: 500; color: var(--text-b); white-space: nowrap; }
    #acp-info { flex: 1; min-width: 0; font-size: 11px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #acp-info.cd { color: var(--warn); }
    #acp-keys { font-size: 10.5px; color: var(--text-3); white-space: nowrap; }

    /* ── Stop / Pause ── */
    #kill { display: flex; gap: 6px; padding: 0 8px 8px; }
    .kb {
      flex: 1; height: 30px; border-radius: 7px;
      background: rgba(255,255,255,.1); color: var(--text-b);
      font: 600 12px var(--f); white-space: nowrap;
    }
    .kb:hover { background: rgba(255,255,255,.16); }
    .kb.stop { background: var(--accent); color: #fff; }
    .kb.stop:hover { background: var(--accent-2); }

    /* ── Settings (⚙) ── */
    #settings {
      margin: 0 6px 6px; padding: 12px; border-radius: 10px;
      background: rgba(16,16,20,.94);
      display: flex; flex-direction: column; gap: 12px; font-size: 13px;
    }
    .srow { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .scol { display: flex; flex-direction: column; gap: 6px; }
    #settings input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
    #settings input[type=range] { accent-color: var(--accent); width: 100%; cursor: pointer; }
    .chips, .corners { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      height: 26px; padding: 0 9px; border-radius: 6px;
      background: rgba(255,255,255,.08); color: var(--text-2); font-size: 12px;
    }
    .chip[aria-pressed="true"] { background: rgba(229,55,43,.22); color: var(--text-b); }
    .corner {
      height: 28px; padding: 0 10px; border-radius: 6px;
      background: rgba(255,255,255,.08); color: var(--text-b); font-size: 12px;
    }
    .corner:hover, .chip:hover { background: rgba(255,255,255,.16); }
    .s-hint { font-size: 11.5px; color: var(--text-2); }
    .s-hint b { color: var(--text-b); font-weight: 600; }
    .s-foot { display: flex; gap: 6px; }
    .s-foot button {
      flex: 1; height: 28px; border-radius: 6px;
      background: rgba(255,255,255,.08); color: var(--text-b); font-size: 12px;
    }
    .s-foot button:hover { background: rgba(255,255,255,.16); }

    /* ── Pill (collapsed) ── */
    #pill {
      display: inline-flex; align-items: center; gap: 8px;
      height: 32px; padding: 0 4px 0 6px; width: max-content;
      background: rgba(10,10,13,var(--op));
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-radius: 16px; white-space: nowrap;
      box-shadow: 0 6px 24px rgba(0,0,0,.25);
      -webkit-app-region: drag; cursor: grab;
    }
    #pill .grip { width: auto; font-size: 11px; }
    #pill-txt { font-size: 12px; }
    #pill .ib { border-radius: 12px; background: rgba(255,255,255,.1); color: var(--text-b); font-size: 13px; }

    /* ── Alert toast (5 s) ── */
    #alert {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 12px; max-width: 250px;
      background: rgba(10,10,13,.8);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-radius: 10px; box-shadow: inset 3px 0 0 var(--err);
      font-size: 12.5px; width: max-content;
    }
    #alert b { font-weight: 600; white-space: nowrap; }
    #alert span { color: #c8c8d0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

    [hidden] { display: none !important; }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 2px; }
  </style>
</head>
<body>
<div id="wrap">

  <!-- ── Expanded card ── -->
  <section id="card" aria-label="Overlay MacroEngine">
    <div id="bar" title="Glisser pour déplacer">
      <span class="grip" aria-hidden="true">⋮⋮</span>
      <span class="sdot" id="bar-dot" aria-hidden="true"></span>
      <span id="bar-count">0 active</span>
      <div class="bar-btns">
        <button type="button" class="ib" id="btn-settings" aria-label="Réglages de l'overlay" aria-expanded="false" aria-controls="settings">⚙</button>
        <button type="button" class="ib" id="btn-col" aria-label="Réduire">–</button>
        <button type="button" class="ib" id="btn-hide" aria-label="Masquer l'overlay">×</button>
      </div>
    </div>

    <div id="settings" hidden role="group" aria-label="Réglages de l'overlay">
      <label class="srow">Overlay activé <input type="checkbox" id="s-enabled" checked></label>
      <label class="scol">Opacité du fond <input type="range" id="s-opacity" min="20" max="100" step="5" value="55"></label>
      <label class="srow">Verrouiller la position <input type="checkbox" id="s-locked"></label>
      <label class="srow">Clic à travers (en jeu) <input type="checkbox" id="s-ct"></label>
      <div class="scol">
        <span>Afficher</span>
        <div class="chips">
          <button type="button" class="chip" data-sec="meal" aria-pressed="true">Repas</button>
          <button type="button" class="chip" data-sec="macros" aria-pressed="true">Macros</button>
          <button type="button" class="chip" data-sec="stats" aria-pressed="true">Stats</button>
        </div>
      </div>
      <div class="corners" role="group" aria-label="Placer dans un coin">
        <button type="button" class="corner" data-corner="tl" aria-label="Coin haut gauche">↖</button>
        <button type="button" class="corner" data-corner="tr" aria-label="Coin haut droit">↗</button>
        <button type="button" class="corner" data-corner="bl" aria-label="Coin bas gauche">↙</button>
        <button type="button" class="corner" data-corner="br" aria-label="Coin bas droit">↘</button>
      </div>
      <div class="s-hint">Raccourci : <b id="s-key">aucun</b> afficher / masquer</div>
      <div class="s-hint" id="s-ct-hint" hidden>Clic à travers : seule la barre du haut reste cliquable.</div>
      <div class="s-foot">
        <button type="button" id="btn-focus-main">Ouvrir l'app</button>
        <button type="button" id="btn-close">Fermer l'overlay</button>
      </div>
    </div>

    <div id="stats">
      <div class="st"><span class="st-v" id="st-dur">0:00</span><span class="st-l">session</span></div>
      <div class="st"><span class="st-v" id="st-cph">—</span><span class="st-l">cycles/h</span></div>
      <div class="st"><span class="st-v ok" id="st-err">0</span><span class="st-l">erreurs</span></div>
    </div>

    <div id="meal" hidden>
      <div class="meal-row"><span class="lbl">Repas</span><span id="meal-txt"></span></div>
      <div class="prog" role="progressbar" aria-label="Intervalle Auto Bouffe écoulé" aria-valuemin="0" aria-valuemax="100" id="meal-prog"><div id="meal-bar"></div></div>
    </div>

    <div id="mlist"><div class="empty">Chargement…</div></div>

    <div id="acp">
      <span class="sdot" id="acp-dot" aria-hidden="true"></span>
      <span id="acp-title">Auto Clicker</span>
      <span id="acp-info">—</span>
      <span id="acp-keys"><span id="ahk-s">F6</span>/<span id="ahk-e">F7</span></span>
      <button type="button" class="mb" id="acp-btn" aria-label="Démarrer l'Auto Clicker">▶</button>
    </div>

    <div id="kill">
      <button type="button" class="kb stop" id="btn-stop">■ Stop · <span id="k-stop">F12</span></button>
      <button type="button" class="kb" id="btn-pause"><span id="k-pause-lbl">❚❚ Pause</span> · <span id="k-pause">F11</span></button>
    </div>
  </section>

  <!-- ── Collapsed pill ── -->
  <section id="pill" aria-label="Overlay réduit" hidden>
    <span class="grip" aria-hidden="true">⋮⋮</span>
    <span class="sdot" id="pill-dot" aria-hidden="true"></span>
    <span id="pill-txt">0</span>
    <button type="button" class="ib" id="btn-expand" aria-label="Déplier">+</button>
  </section>

  <!-- ── Critical alert toast ── -->
  <section id="alert" role="alert" aria-live="assertive" hidden><b id="alert-t"></b><span id="alert-m"></span></section>
</div>
<script>
'use strict';

const $ = (id) => document.getElementById(id);

const allM   = [];          // macro names (macros.json)
const run    = new Map();   // running macro name → start ts (ms)
let _acpOn   = false;
let _acpCfg  = null;
let _cdTimer = null;
let _paused  = false;
let _col     = false;
try { _col = localStorage.getItem('ov-c') === '1'; } catch (_) {}

/* Settings (persisted by main in settings.json — overlay*) */
const S = { opacity: 55, locked: false, clickThrough: false, sections: { meal: true, macros: true, stats: true } };
/* Latest feed from the main renderer (overlay:data) */
const D = { session: null, meal: null, macroCycles: {} };

const nf = (n) => (Number(n) || 0).toLocaleString('fr-FR');

function fmtSession(s) {                       // 8040 → "2:14"
  s = Math.max(0, Math.floor(s || 0));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return `${h}:${String(m).padStart(2, '0')}`;
}
function fmtLeft(ms) {                         // → "1 h 26" / "12 min" / "40 s"
  const s = Math.max(0, Math.round((ms || 0) / 1000));
  if (s >= 3600) { const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return `${h} h ${String(m).padStart(2, '0')}`; }
  if (s >= 60) return `${Math.floor(s / 60)} min`;
  return `${s} s`;
}
function fmtClock(ts) {
  const d = new Date(ts);
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
function fmtElapsed(ms) {
  const s = Math.floor(ms / 1000), m = Math.floor(s / 60), h = Math.floor(m / 60);
  return h > 0 ? `${h} h ${String(m % 60).padStart(2, '0')}` : `${String(m).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}

/* ── Window sizing: follow #wrap ── */
let _sizeRaf = 0;
function fitWindow() {
  cancelAnimationFrame(_sizeRaf);
  _sizeRaf = requestAnimationFrame(() => {
    const r = $('wrap').getBoundingClientRect();
    window.overlay.setSize(Math.ceil(r.width) + 16, Math.ceil(r.height) + 16);
  });
}
new ResizeObserver(fitWindow).observe($('wrap'));

/* ── collapse ── */
function applyCol() {
  $('card').hidden = _col;
  $('pill').hidden = !_col;
  if (_col) closeSettings();
  try { localStorage.setItem('ov-c', _col ? '1' : '0'); } catch (_) {}
  fitWindow();
}
function toggleCol() { _col = !_col; applyCol(); }

/* ── stop / pause (existing behaviour) ── */
function doStop() {
  window.overlay.stopAll();
  _paused = false; updPause();
}
function doPause() {
  window.overlay.pauseAll();
  _paused = !_paused; updPause();
}
function updPause() {
  $('k-pause-lbl').textContent = _paused ? '▶ Reprendre' : '❚❚ Pause';
  renderHeader();
}

/* ── header / pill ── */
function activeCount() {
  return run.size + (D.meal && D.meal.running ? 1 : 0);
}
function mealLeftText() {
  const m = D.meal;
  if (!m || !m.running) return '';
  if (m.inCycle || m.nextAt == null) return 'en cours…';
  return fmtLeft(m.nextAt - Date.now());
}
function renderHeader() {
  const n = activeCount();
  const cls = _paused && n > 0 ? 'pause' : (n > 0 ? 'on' : '');
  for (const id of ['bar-dot', 'pill-dot']) $(id).className = 'sdot' + (cls ? ' ' + cls : '');
  $('bar-count').textContent = `${n} active${n > 1 ? 's' : ''}`;
  const parts = [String(n)];
  if (D.session) parts.push(`${nf(D.session.cycles)} cycles`);
  const left = mealLeftText();
  if (left) parts.push(`repas ${left}`);
  $('pill-txt').textContent = parts.join(' · ');
}

/* ── stats + meal ── */
function renderStats() {
  const sess = D.session;
  $('stats').hidden = !S.sections.stats;
  if (sess) {
    $('st-dur').textContent = fmtSession(sess.durationS);
    $('st-cph').textContent = sess.cph == null ? '—' : nf(sess.cph);
    const e = Number(sess.errors) || 0;
    $('st-err').textContent = nf(e);
    $('st-err').className = 'st-v ' + (e === 0 ? 'ok' : 'err');
  }
  const m = D.meal;
  const showMeal = !!(S.sections.meal && m && m.running);
  $('meal').hidden = !showMeal;
  if (showMeal) {
    const txt = $('meal-txt');
    txt.textContent = '';
    if (m.inCycle || m.nextAt == null) {
      txt.textContent = 'cycle en cours…';
    } else {
      txt.appendChild(document.createTextNode(fmtClock(m.nextAt) + ' · '));
      const d = document.createElement('span');
      d.className = 'dim';
      d.textContent = 'dans ' + fmtLeft(m.nextAt - Date.now());
      txt.appendChild(d);
    }
    const pct = Math.round(Math.min(1, Math.max(0, Number(m.pct) || 0)) * 100);
    $('meal-bar').style.width = pct + '%';
    $('meal-prog').setAttribute('aria-valuenow', String(pct));
  }
  renderHeader();
}

/* ── macros ── */
function renderMacros() {
  renderHeader();
  const el = $('mlist');
  el.hidden = !S.sections.macros;
  if (el.hidden) { fitWindow(); return; }
  el.textContent = '';

  const rows = [];
  if (D.meal && D.meal.running) {
    rows.push({ kind: 'abf', name: 'Auto Bouffe', on: true, meta: `${D.meal.meals || 0} repas` });
  }
  const names = allM.slice();
  for (const n of run.keys()) if (!names.includes(n)) names.push(n);
  const on = names.filter(n => run.has(n));
  const off = names.filter(n => !run.has(n));
  for (const n of on) {
    const c = D.macroCycles && D.macroCycles[n];
    rows.push({ kind: 'macro', name: n, on: true, meta: c ? nf(c) : fmtElapsed(Date.now() - run.get(n)), start: c ? null : run.get(n) });
  }
  for (const n of off) {
    const c = D.macroCycles && D.macroCycles[n];
    rows.push({ kind: 'macro', name: n, on: false, meta: c ? nf(c) : '' });
  }
  if (!rows.length) {
    const e = document.createElement('div');
    e.className = 'empty'; e.textContent = 'Aucune macro';
    el.appendChild(e); fitWindow(); return;
  }
  for (const r of rows) {
    const row = document.createElement('div');
    row.className = 'mr' + (r.on ? ' r' : '');
    const dot = document.createElement('span'); dot.className = 'sdot'; dot.setAttribute('aria-hidden', 'true');
    const nm = document.createElement('span'); nm.className = 'mn'; nm.textContent = r.name; nm.title = r.name;
    const mt = document.createElement('span'); mt.className = 'mm'; mt.textContent = r.meta;
    if (r.start) mt.dataset.s = String(r.start);
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'mb';
    b.textContent = r.on ? '■' : '▶';
    b.setAttribute('aria-label', (r.on ? 'Arrêter ' : 'Lancer ') + r.name);
    b.addEventListener('click', () => {
      if (r.kind === 'abf') window.overlay.command('abf_stop');
      else if (r.on) window.overlay.macroStop(r.name);
      else window.overlay.macroStart(r.name);
    });
    row.append(dot, nm, mt, b);
    el.appendChild(row);
  }
  fitWindow();
}

setInterval(() => {
  document.querySelectorAll('.mm[data-s]').forEach(el => {
    el.textContent = fmtElapsed(Date.now() - +el.dataset.s);
  });
}, 1000);

async function loadMacros() {
  try { const r = await window.overlay.getMacros(); allM.length = 0; if (r && r.macros) allM.push(...r.macros); } catch (_) {}
  renderMacros();
}

/* ── shortcuts ── */
function applyShortcutLabels(d) {
  if (!d) return;
  if (d.stop)    $('k-stop').textContent  = d.stop;
  if (d.pause)   $('k-pause').textContent = d.pause;
  if ('overlay' in d) $('s-key').textContent = d.overlay || 'aucun';
}
async function loadShortcuts() {
  try { const r = await window.overlay.getShortcuts(); if (r && r.ok) applyShortcutLabels(r); } catch (_) {}
}
window.overlay.onShortcutsUpdated(applyShortcutLabels);

/* ── engine events (existing behaviour) ── */
window.overlay.onStatus(d => {
  const rs = new Set(d.running || []);
  const acpNow = rs.has('__auto_clicker__');
  if (acpNow !== _acpOn) setAcpOn(acpNow);
  for (const n of [...run.keys()]) if (!rs.has(n)) run.delete(n);
  for (const n of rs) {
    if (n === '__auto_clicker__') continue;
    if (!run.has(n)) run.set(n, Date.now());
    if (!allM.includes(n)) allM.push(n);
  }
  _paused = false; updPause(); renderMacros();
});
window.overlay.onStopped(() => { run.clear(); _paused = false; updPause(); setAcpOn(false); renderMacros(); });
window.overlay.onMacrosUpdated(() => loadMacros());
window.overlay.onAcpStatus(d => { if (!d.running && _cdTimer) clearCd(); setAcpOn(!!d.running); });

/* ── feed from main renderer: session / meal / per-macro cycles / alert ── */
window.overlay.onData(d => {
  if (!d || typeof d !== 'object') return;
  if (d.alert) showAlert(d.alert);
  let changed = false;
  if (d.session) { D.session = d.session; changed = true; }
  if (d.meal) { D.meal = d.meal; changed = true; }
  if (d.macroCycles) { D.macroCycles = d.macroCycles; changed = true; }
  if (changed) { renderStats(); renderMacros(); }
});

/* ── alert toast (5 s) ── */
let _alertTimer = null;
function showAlert(a) {
  $('alert-t').textContent = String(a.title || 'Alerte');
  $('alert-m').textContent = String(a.message || '');
  $('alert-m').title = String(a.message || '');
  $('alert').hidden = false;
  fitWindow();
  clearTimeout(_alertTimer);
  _alertTimer = setTimeout(() => { $('alert').hidden = true; fitWindow(); }, 5000);
}

/* ── Auto Clicker (existing logic, compact row) ── */
function acpSum(c) {
  if (!c) return '—';
  const h = +c['acp-h'] || 0, m = +c['acp-m'] || 0, s = +c['acp-s'] || 0, ms = +c['acp-ms'] || 100;
  const t = h * 3600000 + m * 60000 + s * 1000 + ms;
  const b = c['acp-button'] || 'left', ct = c['acp-click-type'] || 'single';
  return `${b} ${ct === 'double' ? 'dbl' : ct === 'triple' ? '3×' : '1×'} · ${t < 1000 ? t + 'ms' : (t / 1000).toFixed(1) + 's'}`;
}

function buildMacro(c) {
  const h = +c['acp-h'] || 0, m = +c['acp-m'] || 0, s = +c['acp-s'] || 0, ms = +c['acp-ms'] || 100;
  const iv = Math.max(0.001, h * 3600 + m * 60 + s + ms / 1000);
  const rand = c['acp-rand-offset'] === true || c['acp-rand-offset'] === 'true';
  const rm = (+c['acp-rand-ms'] || 40) / 1000;
  const btn = c['acp-button'] || 'left', ct = c['acp-click-type'] || 'single';
  const rmode = c['acp-repeat-mode'] || 'until_stopped', rct = +c['acp-repeat-count'] || 1;
  const pos = c['acp-pos-mode'] || 'current';
  const xy = pos !== 'current' ? { x: +c['acp-x'] || 0, y: +c['acp-y'] || 0 } : {};
  const wait = rand ? { type: 'random_wait', min: Math.max(0.001, iv - rm), max: iv + rm } : { type: 'wait', duration: iv };
  const click = ct === 'double' ? { type: 'mouse_double_click', button: btn, ...xy }
    : ct === 'triple' ? { type: 'mouse_click', button: btn, count: 3, ...xy }
    : { type: 'mouse_click', button: btn, count: 1, ...xy };
  const acts = rmode === 'count' ? [{ type: 'repeat', count: Math.max(1, rct), actions: [click, wait] }] : [click, wait];
  return { name: '__auto_clicker__', loop: rmode !== 'count', loop_delay: 0,
    rules: [{ enabled: true, label: 'click', conditions: [], actions: acts }] };
}

function setAcpBtn(mode) {           // 'start' | 'stop' | 'cancel'
  const b = $('acp-btn');
  b.textContent = mode === 'stop' ? '■' : mode === 'cancel' ? '✕' : '▶';
  b.setAttribute('aria-label', mode === 'stop' ? "Arrêter l'Auto Clicker" : mode === 'cancel' ? 'Annuler le démarrage' : "Démarrer l'Auto Clicker");
}

function setAcpOn(on) {
  _acpOn = on;
  $('acp-dot').classList.toggle('on', on);
  if (on) clearCd();
  setAcpBtn(on ? 'stop' : 'start');
}

function clearCd() {
  if (_cdTimer) { clearInterval(_cdTimer); _cdTimer = null; }
  const info = $('acp-info');
  info.classList.remove('cd');
  info.textContent = acpSum(_acpCfg);
  setAcpBtn(_acpOn ? 'stop' : 'start');
}

async function loadAcpCfg() {
  try {
    const r = await window.overlay.getAcpConfig();
    if (r && r.ok && r.config) {
      _acpCfg = r.config;
      $('acp-info').textContent = acpSum(_acpCfg);
      $('ahk-s').textContent = _acpCfg['acp-key-start'] || 'F6';
      $('ahk-e').textContent = _acpCfg['acp-key-stop']  || 'F7';
    }
  } catch (_) {}
}

async function acpToggle() {
  if (_cdTimer) { clearCd(); return; }                 // cancel the countdown
  if (_acpOn) { window.overlay.acpStop(); setAcpOn(false); return; }

  await loadAcpCfg();
  if (!_acpCfg) { $('acp-info').textContent = 'Config manquante'; return; }

  const delay = +(_acpCfg['acp-start-delay']) || 0;
  if (delay > 0) {
    let rem = delay;
    const info = $('acp-info');
    info.classList.add('cd');
    info.textContent = `Démarrage dans ${rem} s`;
    setAcpBtn('cancel');
    _cdTimer = setInterval(() => {
      rem--;
      if (rem <= 0) {
        clearCd();
        window.overlay.acpStart(buildMacro(_acpCfg));
        setAcpOn(true);
      } else {
        info.textContent = `Démarrage dans ${rem} s`;
      }
    }, 1000);
  } else {
    window.overlay.acpStart(buildMacro(_acpCfg));
    setAcpOn(true);
  }
}

/* ── settings popover ── */
function settingsOpen() { return !$('settings').hidden; }
function openSettings() {
  $('settings').hidden = false;
  $('btn-settings').setAttribute('aria-expanded', 'true');
  setIgnore(false);
  fitWindow();
}
function closeSettings() {
  if (!settingsOpen()) return;
  $('settings').hidden = true;
  $('btn-settings').setAttribute('aria-expanded', 'false');
  if (S.clickThrough) setIgnore(true);
  fitWindow();
}

function applySettingsUI() {
  document.documentElement.style.setProperty('--op', (S.opacity / 100).toFixed(2));
  document.body.classList.toggle('locked', !!S.locked);
  document.body.classList.toggle('ct', !!S.clickThrough);
  $('s-opacity').value = String(S.opacity);
  $('s-locked').checked = !!S.locked;
  $('s-ct').checked = !!S.clickThrough;
  $('s-ct-hint').hidden = !S.clickThrough;
  document.querySelectorAll('.chip[data-sec]').forEach(c => {
    c.setAttribute('aria-pressed', S.sections[c.dataset.sec] !== false ? 'true' : 'false');
  });
  renderStats(); renderMacros();
}

async function loadSettings() {
  try {
    const r = await window.overlay.getSettings();
    if (r) {
      S.opacity = Number(r.opacity) || 55;
      S.locked = !!r.locked;
      S.clickThrough = !!r.clickThrough;
      S.sections = Object.assign({ meal: true, macros: true, stats: true }, r.sections || {});
      $('s-key').textContent = r.shortcut || 'aucun';
    }
  } catch (_) {}
  applySettingsUI();
  if (S.clickThrough) setIgnore(true);
}

let _opTimer = null;
$('s-opacity').addEventListener('input', (e) => {
  S.opacity = Math.min(100, Math.max(20, Number(e.target.value) || 55));
  document.documentElement.style.setProperty('--op', (S.opacity / 100).toFixed(2));
  clearTimeout(_opTimer);
  _opTimer = setTimeout(() => window.overlay.setSettings({ opacity: S.opacity }), 250);
});
$('s-enabled').addEventListener('change', (e) => {
  if (!e.target.checked) {
    closeSettings();
    e.target.checked = true;          // shown again = enabled again
    window.overlay.setSettings({ enabled: false });
  }
});
$('s-locked').addEventListener('change', (e) => {
  S.locked = e.target.checked; applySettingsUI();
  window.overlay.setSettings({ locked: S.locked });
});
$('s-ct').addEventListener('change', (e) => {
  S.clickThrough = e.target.checked; applySettingsUI();
  window.overlay.setSettings({ clickThrough: S.clickThrough });
  // Settings are open → stay interactive until they close.
  setIgnore(false);
});
document.querySelectorAll('.chip[data-sec]').forEach(c => c.addEventListener('click', () => {
  const k = c.dataset.sec;
  S.sections[k] = !(S.sections[k] !== false);
  applySettingsUI();
  window.overlay.setSettings({ sections: Object.assign({}, S.sections) });
}));
document.querySelectorAll('.corner[data-corner]').forEach(b => b.addEventListener('click', () => {
  window.overlay.snapCorner(b.dataset.corner);
}));

/* ── click-through: only the top bar / pill stays reachable ── */
let _ignoring = false;
function setIgnore(on) {
  if (on === _ignoring) return;
  _ignoring = on;
  window.overlay.setIgnoreMouse(on);
}
document.addEventListener('mousemove', (e) => {
  if (!S.clickThrough) return;
  if (settingsOpen()) { setIgnore(false); return; }
  const t = e.target;
  const overBar = !!(t && t.closest && t.closest('#bar, #pill'));
  setIgnore(!overBar);
});
document.documentElement.addEventListener('mouseleave', () => {
  if (S.clickThrough && !settingsOpen()) setIgnore(true);
});

/* ── buttons ── */
$('btn-settings').addEventListener('click', () => settingsOpen() ? closeSettings() : openSettings());
$('btn-col').addEventListener('click', toggleCol);
$('btn-expand').addEventListener('click', toggleCol);
$('btn-hide').addEventListener('click', () => window.overlay.hide());
$('btn-close').addEventListener('click', () => window.overlay.close());
$('btn-focus-main').addEventListener('click', () => window.overlay.focusMain());
$('btn-stop').addEventListener('click', doStop);
$('btn-pause').addEventListener('click', doPause);
$('acp-btn').addEventListener('click', acpToggle);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && settingsOpen()) { e.preventDefault(); closeSettings(); $('btn-settings').focus(); }
});

/* Header countdown ("repas 1 h 26") between two feed pushes */
setInterval(() => { if (D.meal && D.meal.running) renderStats(); }, 15000);

/* ── init ── */
applyCol();
loadSettings();
loadMacros();
loadShortcuts();
loadAcpCfg();
</script>
</body>
</html>
